server {
    listen 80;
    server_name _;

    # Frontend build artifacts (copied from frontend/dist)
    root /opt/planopt/app/frontend/dist;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin static (если нужно отдавать собранные staticfiles)
    location /static/ {
        alias /opt/planopt/app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }
}

